[package]
name = "better-drop"
version = "0.1.0"
description = "Chuyển file giữa Mac và Windows qua mạng LAN"
edition = "2021"

[lib]
name = "better_drop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-manual-roots-no-provider"] }
mdns-sd = "0.21"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
hostname = "0.4"
if-addrs = "0.15"
unicode-normalization = "0.1"
dirs = "6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Chỉ có trên máy tính: tự mở cùng máy, chỉ chạy một bản.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

# Chỉ có trên điện thoại: quét mã QR bằng camera.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-betterdrop-mobile = { path = "plugins/betterdrop-mobile" }

[dev-dependencies]
tempfile = "3"

# Bản phát hành nhỏ gọn hơn (đặc biệt quan trọng với APK Android chứa 4 kiến trúc CPU).
[profile.release]
strip = true
lto = true
codegen-units = 1
