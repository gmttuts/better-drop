[package]
name = "better-drop"
version = "0.3.6"
description = "Chuyển file giữa Mac và Windows qua mạng LAN"
edition = "2021"

[lib]
name = "better_drop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
futures-util = "0.3"
axum = "0.8"
tokio-rustls = { version = "0.26", default-features = false }
tower = { version = "0.5", default-features = false }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-manual-roots-no-provider", "multipart"] }
mdns-sd = "0.21"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
hostname = "0.4"
if-addrs = "0.15"
unicode-normalization = "0.1"
dirs = "6"
zip = { version = "9", default-features = false }
sys-locale = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Gửi qua Internet: AES-256-GCM (ring đã có sẵn qua rustls), khoá base64url, CRC32 cho zip.
ring = "0.17"
base64 = "0.22"
crc32fast = "1"
bytes = "1"
# Chứng chỉ gốc để gọi dịch vụ trên Internet (GitHub API, dịch vụ lưu file).
webpki-roots = "1"
# Ảnh thu nhỏ gửi kèm yêu cầu nhận (xem trước ảnh). HEIC không giải mã được: bỏ qua
# (điện thoại dùng thư viện của hệ thống qua plugin).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

# Chỉ có trên máy tính: tự mở cùng máy, chỉ chạy một bản.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# Windows: ghi menu chuột phải "Gửi bằng BetterDrop" (danh sách máy) vào registry.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

# Chỉ có trên điện thoại: quét mã QR bằng camera, báo có bản mới.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-betterdrop-mobile = { path = "plugins/betterdrop-mobile" }

[dev-dependencies]
tempfile = "3"

# Giải mã ảnh ở bản debug chậm hàng chục lần, vượt giới hạn thời gian tạo ảnh thu nhỏ.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3

# Bản phát hành nhỏ gọn hơn (đặc biệt quan trọng với APK Android chứa 4 kiến trúc CPU).
[profile.release]
strip = true
lto = true
codegen-units = 1
