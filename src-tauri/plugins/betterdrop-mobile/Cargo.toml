[package]
name = "tauri-plugin-betterdrop-mobile"
version = "0.1.0"
authors = [ "Nguyen Tuyen" ]
description = "API riêng cho Android/iOS của BetterDrop"
edition = "2024"
rust-version = "1.90"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-betterdrop-mobile"

[dependencies]
tauri = { version = "2.12.4" }
serde = "1.0"
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }
