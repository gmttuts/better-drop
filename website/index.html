<!doctype html>
<html lang="vi">
<head>

  <title>BetterDrop — gửi file giữa mọi thiết bị, như AirDrop</title>
  <meta name="description" content="BetterDrop chuyển file, thư mục và văn bản giữa Mac, Windows, Linux, Android và iPhone trong cùng mạng Wi‑Fi, đi thẳng giữa hai máy, không qua máy chủ. Không cần tài khoản, miễn phí.">

  <meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:title" content="BetterDrop">
  <meta property="og:description" content="Gửi file giữa Mac, Windows, Linux, Android và iPhone qua Wi‑Fi, như AirDrop. Miễn phí.">
  <meta property="og:image" content="https://gmttuts.github.io/better-drop/assets/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="#top"><img src="assets/icon.png" alt="" width="28" height="28">BetterDrop</a>
    <nav class="links">
      <a href="#how" data-i18n="nav.how"></a>
      <a href="#features" data-i18n="nav.features"></a>
      <a href="#browser" data-i18n="nav.browser"></a>
      <a href="#faq" data-i18n="nav.faq"></a>
      <a href="#support" data-i18n="nav.support"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language / Ngôn ngữ"><button data-lang="en">EN</button><button data-lang="vi">VI</button></div>
    <a class="btn btn-small" href="#download" data-i18n="nav.download"></a>
  </header>

  <main id="top">
    <section class="hero wrap">
      <div class="hero-sky">
        <a class="pill" href="#browser"><span class="pill-new" data-i18n="hero.new"></span><span data-i18n="hero.pill"></span> <span aria-hidden="true">→</span></a>
        <h1 data-i18n="hero.title"></h1>
        <p class="lead" data-i18n="hero.sub"></p>
        <div class="cta-row">
          <a class="btn" data-primary-download href="https://github.com/gmttuts/better-drop/releases/latest"><span data-os-icon></span><span data-primary-label></span></a>
          <button type="button" class="btn btn-soft" data-support="both">☕ <span data-i18n="nav.support"></span></button>
        </div>
        <p class="fine"><span data-version-label></span> · <span data-i18n="hero.fine"></span> · <a href="#download" data-i18n="hero.other"></a></p>
        <div class="os-row" aria-hidden="true" data-os-row></div>
        <figure class="window">
          <div class="chrome"><i></i><i></i><i></i><span data-i18n="demo.badge"></span></div>
          <div class="demo-box"><iframe src="demo/index.html" title="BetterDrop" data-demo loading="eager"></iframe></div>
        </figure>
        <p class="demo-hint fine" data-i18n="demo.hint"></p>
      </div>
    </section>

    <section class="wrap">
      <dl class="stats">
        <div><dt>5</dt><dd data-i18n="stats.platforms"></dd></div>
        <div><dt data-i18n="stats.cloudN"></dt><dd data-i18n="stats.cloud"></dd></div>
        <div><dt>TLS</dt><dd data-i18n="stats.tls"></dd></div>
        <div><dt data-i18n="stats.freeN"></dt><dd data-i18n="stats.free"></dd></div>
      </dl>
    </section>

    <section id="how" class="block wrap">
      <h2><span data-i18n="how.kicker"></span>. <span class="soft" data-i18n="how.title"></span></h2>
      <ol class="how">
        <li>
          <div class="how-art" aria-hidden="true">
            <div class="radar"><span></span><span></span><span></span><b class="dev d1"></b><b class="dev d2"></b><b class="dev d3"></b><img src="assets/icon.png" alt="" width="44" height="44"></div>
          </div>
          <h3 data-i18n="how.1.t"></h3><p data-i18n="how.1.d"></p>
        </li>
        <li>
          <div class="how-art" aria-hidden="true">
            <div class="mini-list">
              <i class="file"><b>📄</b>Báo cáo quý 3.xlsx</i>
              <i class="file"><b>📁</b>Hợp đồng 2026</i>
              <i class="to on"><b>☑</b>Pixel 9</i>
              <i class="to on"><b>☑</b>PC Thiết kế</i>
            </div>
          </div>
          <h3 data-i18n="how.2.t"></h3><p data-i18n="how.2.d"></p>
        </li>
        <li>
          <div class="how-art" aria-hidden="true">
            <div class="mini-ask">
              <strong>MacBook</strong>
              <span>3 file · 700 MB</span>
              <div><em>✕</em><em class="ok">✓</em></div>
            </div>
          </div>
          <h3 data-i18n="how.3.t"></h3><p data-i18n="how.3.d"></p>
        </li>
      </ol>
    </section>

    <section id="features" class="block wrap">
      <h2><span data-i18n="feat.kicker"></span>. <span class="soft" data-i18n="feat.title"></span></h2>
      <div class="features" data-features></div>
    </section>

    <section id="browser" class="block wrap">
      <div class="browser-card">
        <div class="browser-text">
          <h2><span data-i18n="br.kicker"></span>. <span class="soft" data-i18n="br.title"></span></h2>
          <p class="lead-sm" data-i18n="br.sub"></p>
          <ul class="ticks">
            <li data-i18n="br.1"></li>
            <li data-i18n="br.2"></li>
            <li data-i18n="br.3"></li>
          </ul>
        </div>
        <div class="phone" aria-hidden="true">
          <div class="phone-screen">
            <div class="url">🔒︎ 192.168.1.12:53319</div>
            <div class="web-head"><img src="assets/icon.png" alt="" width="28" height="28"><div><b data-i18n="br.mock.title"></b><small data-i18n="br.mock.files"></small></div></div>
            <ul class="web-files">
              <li><span>Hồ sơ khách hàng.pdf</span><small>2.4 MB</small><i>↓</i></li>
              <li><span>Ảnh sự kiện.zip</span><small>700 MB</small><i>↓</i></li>
              <li><span>Ghi chú họp.txt</span><small>3 KB</small><i>↓</i></li>
            </ul>
            <div class="web-btn" data-i18n="br.mock.all"></div>
            <div class="web-btn ghost" data-i18n="br.mock.send"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="download" class="block wrap">
      <h2><span data-i18n="dl.kicker"></span>. <span class="soft" data-i18n="dl.title"></span></h2>
      <p class="release-line fine" data-release-line></p>
      <div class="platforms" data-platforms></div>

      <div class="notes">
        <div class="warn">
          <h3>⚠️ <span data-i18n="warn.title"></span></h3>
          <p data-i18n="warn.body"></p>
        </div>
        <div class="netbox">
          <h3 data-i18n="net.title"></h3>
          <ul>
            <li data-i18n="net.1"></li>
            <li data-i18n="net.2"></li>
            <li data-i18n="net.3"></li>
            <li data-i18n="net.4"></li>
          </ul>
        </div>
      </div>
    </section>

          </div>
        </div>

            <line x1="292" y1="58" x2="276" y2="82"/><line x1="306" y1="108" x2="282" y2="116"/>
          </g>
          <g class="cup-steam" fill="none" stroke="#2b2420" stroke-width="5" stroke-linecap="round">
            <path d="M120 82c-10-12 10-22 0-36"/><path d="M152 70c-12-14 12-26 0-44"/><path d="M184 82c-10-12 10-22 0-36"/>
          </g>
          <path d="M248 138c34-6 46 34 14 54-10 6-24 8-36 6" fill="none" stroke="#2b2420" stroke-width="8" stroke-linecap="round"/>
          <path d="M54 118h196c0 70-26 120-98 120S54 188 54 118z" fill="#fffaf2" stroke="#2b2420" stroke-width="8" stroke-linejoin="round"/>
          <ellipse cx="152" cy="118" rx="98" ry="20" fill="#5a3a24" stroke="#2b2420" stroke-width="8"/>
          <ellipse cx="128" cy="113" rx="34" ry="6" fill="#7b5235"/>
          <g class="cup-face">
            <circle cx="122" cy="172" r="7" fill="#2b2420"/><circle cx="182" cy="172" r="7" fill="#2b2420"/>
            <path d="M136 192q16 14 32 0" fill="none" stroke="#2b2420" stroke-width="6" stroke-linecap="round"/>
            <circle cx="104" cy="190" r="9" fill="#ffb4a2" opacity=".7"/><circle cx="200" cy="190" r="9" fill="#ffb4a2" opacity=".7"/>
          </g>
        </svg>
      </div>
    </section>

      <h2 data-i18n="faq.title"></h2>
      <div class="faq" data-faq></div>

    <section class="block wrap">
      <div class="cta-card">
        <img src="assets/icon.png" alt="" width="88" height="88">
        <h2 data-i18n="cta.title"></h2>
        <p data-i18n="cta.sub"></p>
        <div class="cta-row">
          <a class="btn" data-primary-download href="https://github.com/gmttuts/better-drop/releases/latest"><span data-os-icon></span><span data-primary-label></span></a>
          <button type="button" class="btn btn-soft" data-support="both">☕ <span data-i18n="nav.support"></span></button>
        </div>
        <p class="fine"><a href="#download" data-i18n="hero.other"></a></p>
      </div>
    </section>
