name: Build

# Build file cài cho mọi nền tảng. Chỉ chạy khi:
# - đẩy tag dạng v0.3.7: tạo một bản phát hành nháp (Release) chứa file cài của mọi nền tảng;
# - bấm "Run workflow" trong tab Actions (lấy file cài thử trong mục Artifacts, giữ 5 ngày).
# Đẩy code lên main thì chỉ chạy test nhẹ (test.yml) cho đỡ tốn tài nguyên.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Chạy lại cùng một tag/nhánh thì huỷ lần chạy cũ.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
            bundles: |
              src-tauri/target/release/bundle/msi/*.msi*
              src-tauri/target/release/bundle/nsis/*.exe*
          - name: linux
            # Ubuntu 22.04: glibc cũ hơn nên file .AppImage/.deb chạy được trên nhiều bản Linux hơn.
            os: ubuntu-22.04
            args: ""
            bundles: |
              src-tauri/target/release/bundle/deb/*.deb*
              src-tauri/target/release/bundle/rpm/*.rpm*
              src-tauri/target/release/bundle/appimage/*.AppImage*
          - name: macos
            os: macos-latest
            args: "--target universal-apple-darwin"
            bundles: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cài thư viện hệ thống (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Cache tạo từ tag không dùng lại được cho tag sau, nên chỉ lưu khi chạy tay trên main.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      - name: Test
        working-directory: src-tauri
        run: cargo test

      - name: Build
        shell: bash
        env:
          # Khoá ký bản cập nhật (GitHub Secret). PR từ repo khác không có khoá thì build không ký.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          UPDATER=""
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then UPDATER="--config src-tauri/tauri.updater.conf.json"; fi
          npm run tauri build -- ${{ matrix.args }} $UPDATER

      - uses: actions/upload-artifact@v4
        with:
          name: BetterDrop-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 5


  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Cache tạo từ tag không dùng lại được cho tag sau, nên chỉ lưu khi chạy tay trên main.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cài Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Build APK
        run: npm run tauri android build -- --apk

      - name: Đổi tên APK
        run: |
          mkdir -p out
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk out/BetterDrop-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BetterDrop-android
          path: out/BetterDrop-android.apk
          if-no-files-found: error
          retention-days: 5


  ios:
    # File .ipa CHƯA KÝ: cài lên iPhone bằng Sideloadly/AltStore (tự ký bằng Apple ID).
    # Muốn TestFlight/App Store thì cần tài khoản Apple Developer và chứng chỉ ký.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Cache tạo từ tag không dùng lại được cho tag sau, nên chỉ lưu khi chạy tay trên main.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      - name: Build IPA (chưa ký)
        run: npm run tauri ios build -- --target aarch64 --no-sign --ci

      # Vẫn là bản chưa ký thật (chỉ ký ad-hoc), để Sideloadly/AltStore biết cần App Group
      # cho "Chia sẻ → BetterDrop".
      - name: Gắn entitlements vào IPA
        run: scripts/ios-add-entitlements.sh src-tauri/gen/apple/build/arm64/BetterDrop.ipa

      - name: Đổi tên IPA
        run: |
          mkdir -p out
          cp src-tauri/gen/apple/build/arm64/BetterDrop.ipa out/BetterDrop-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BetterDrop-ios
          path: out/BetterDrop-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 5

  release:
    # Đẩy tag dạng v0.2.0: gom file cài của mọi nền tảng vào MỘT bản phát hành nháp.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Tạo latest.json (tự cập nhật)
        run: node scripts/make-latest-json.mjs files "${{ github.ref_name }}" "${{ github.repository }}"

      - run: ls -laR files

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: files/**/*
