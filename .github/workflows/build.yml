name: Build

# Build đầy đủ chỉ chạy khi:
#  - Đẩy tag dạng v0.2.0  -> build cả 5 nền tảng + tạo bản phát hành nháp (Release).
#  - Bấm tay (Actions -> Build -> Run workflow) -> tự chọn nền tảng cần build.
# Push thường lên main KHÔNG chạy gì ở workflow này (đã có test.yml nhẹ lo việc đó).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows:
        description: "Build Windows (tính phút x2)"
        type: boolean
        default: true
      linux:
        description: "Build Linux (x1)"
        type: boolean
        default: true
      macos:
        description: "Build macOS (x10, tốn nhất)"
        type: boolean
        default: false
      android:
        description: "Build Android (x1)"
        type: boolean
        default: false
      ios:
        description: "Build iOS (x10, tốn nhất)"
        type: boolean
        default: false

# Có push/bấm mới thì hủy lần chạy cũ cùng ref để khỏi tốn phút chạy chồng.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job nhẹ (vài giây): quyết định nền tảng nào cần build.
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      has_desktop: ${{ steps.pick.outputs.has_desktop }}
      android: ${{ steps.pick.outputs.android }}
      ios: ${{ steps.pick.outputs.ios }}
    steps:
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          IN_WINDOWS: ${{ inputs.windows }}
          IN_LINUX: ${{ inputs.linux }}
          IN_MACOS: ${{ inputs.macos }}
          IN_ANDROID: ${{ inputs.android }}
          IN_IOS: ${{ inputs.ios }}
        run: |
          ALL='[
            {"name":"windows","os":"windows-latest","args":"","bundles":"src-tauri/target/release/bundle/msi/*.msi*\nsrc-tauri/target/release/bundle/nsis/*.exe*"},
            {"name":"linux","os":"ubuntu-22.04","args":"","bundles":"src-tauri/target/release/bundle/deb/*.deb*\nsrc-tauri/target/release/bundle/rpm/*.rpm*\nsrc-tauri/target/release/bundle/appimage/*.AppImage*"},
            {"name":"macos","os":"macos-latest","args":"--target universal-apple-darwin","bundles":"src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg\nsrc-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*"}
          ]'

          WANT=""
          ANDROID=false
          IOS=false

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$IN_WINDOWS" = "true" ]; then WANT="$WANT windows"; fi
            if [ "$IN_LINUX" = "true" ]; then WANT="$WANT linux"; fi
            if [ "$IN_MACOS" = "true" ]; then WANT="$WANT macos"; fi
            if [ "$IN_ANDROID" = "true" ]; then ANDROID=true; fi
            if [ "$IN_IOS" = "true" ]; then IOS=true; fi
          else
            # Đẩy tag: build tất cả
            WANT="windows linux macos"
            ANDROID=true
            IOS=true
          fi

          MATRIX=$(echo "$ALL" | jq -c --arg want "$WANT" \
            '[.[] | select(.name as $n | ($want | split(" ") | index($n)) != null)]')

          if [ "$MATRIX" = "[]" ]; then HAS=false; else HAS=true; fi

          {
            echo "matrix=$MATRIX"
            echo "has_desktop=$HAS"
            echo "android=$ANDROID"
            echo "ios=$IOS"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    if: needs.setup.outputs.has_desktop == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cài thư viện hệ thống (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # cargo test đã chạy ở test.yml (Linux, rẻ), nên không lặp lại trên 3 hệ điều hành.

      - name: Build
        shell: bash
        env:
          # Khoá ký bản cập nhật (GitHub Secret).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          UPDATER=""
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then UPDATER="--config src-tauri/tauri.updater.conf.json"; fi
          npm run tauri build -- ${{ matrix.args }} $UPDATER

      - uses: actions/upload-artifact@v4
        with:
          name: BetterDrop-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  android:
    needs: setup
    if: needs.setup.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cài Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Build APK
        run: npm run tauri android build -- --apk

      - name: Đổi tên APK
        run: |
          mkdir -p out
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk out/BetterDrop-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BetterDrop-android
          path: out/BetterDrop-android.apk
          if-no-files-found: error

  ios:
    # File .ipa CHƯA KÝ: cài lên iPhone bằng Sideloadly/AltStore (tự ký bằng Apple ID).
    # Muốn TestFlight/App Store thì cần tài khoản Apple Developer và chứng chỉ ký.
    needs: setup
    if: needs.setup.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build IPA (chưa ký)
        run: npm run tauri ios build -- --target aarch64 --no-sign --ci

      - name: Đổi tên IPA
        run: |
          mkdir -p out
          cp src-tauri/gen/apple/build/arm64/BetterDrop.ipa out/BetterDrop-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BetterDrop-ios
          path: out/BetterDrop-ios-unsigned.ipa
          if-no-files-found: error

  release:
    # Đẩy tag dạng v0.2.0: gom file cài của mọi nền tảng vào MỘT bản phát hành nháp.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Tạo latest.json (tự cập nhật)
        run: node scripts/make-latest-json.mjs files "${{ github.ref_name }}" "${{ github.repository }}"

      - run: ls -laR files

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: files/**/*
